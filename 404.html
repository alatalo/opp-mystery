<script>
/* A 404 page can be served from any depth. The base is the site's folder: the repo folder on GitHub project
   pages, the folder of 404.html when opened directly, otherwise the domain root. */
(function () {
  var base = '/';
  var path = location.pathname;
  // GitHub project pages: /repo/anything -> /repo/ ; a file served at its own place: /sub/404.html -> /sub/
  if (/\.github\.io$/.test(location.hostname)) { base = '/' + path.split('/')[1] + '/'; }
  else if (/\/404\.html$/.test(path)) { base = path.replace(/404\.html$/, ''); }
  document.write('<base href="' + base + '">');
  document.documentElement.className += ' js';
})();
</script>
