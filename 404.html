<script>
/* A 404 page is served from any depth, so work out the site root: on GitHub Pages project sites
   it is the first path segment (/repo/), otherwise the domain root. */
(function () {
  var base = '/';
  if (/\.github\.io$/.test(location.hostname)) { base = '/' + location.pathname.split('/')[1] + '/'; }
  document.write('<base href="' + base + '">');
  document.documentElement.className += ' js';
})();
</script>
